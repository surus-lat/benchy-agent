name: Deploy

# Every push to main deploys what it changed, so main is always what runs:
#   api    D1 migrations, then the Worker benchy-api (apps/api, packages/db)
#   web    the site on Cloudflare Pages, getbenchy.lat (apps/web)
# Tests run first; a failure deploys nothing. The web waits for the Worker
# when both changed, since it calls it.
#
# The per-org agents run on AWS ECS Fargate (cluster benchy), not Railway:
# their image is built and pushed by hand (benchy-migration/push-image.sh),
# never by CI, so changes under apps/agent trigger no deploy here.
#
# Secrets: CLOUDFLARE_API_TOKEN. Variable: CLOUDFLARE_ACCOUNT_ID. Secrets
# never reach pull requests from forks: this runs only on pushes to main
# and by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, web]
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          API: ${{ steps.filter.outputs.api }}
          WEB: ${{ steps.filter.outputs.web }}
        # By hand: what was chosen. On a push: what the push changed.
        run: |
          pick() {
            if [ "$EVENT" = workflow_dispatch ]; then
              { [ "$TARGET" = all ] || [ "$TARGET" = "$1" ]; } && echo true || echo false
            else
              echo "$2"
            fi
          }
          { echo "api=$(pick api "$API")"; echo "web=$(pick web "$WEB")"; } | tee -a "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @benchy/api test && pnpm --filter @benchy/api test:scripts
      - name: D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @benchy/api exec wrangler d1 migrations apply benchy-db --remote
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:api

  web:
    needs: [changes, api]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && needs.api.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @benchy/web typecheck && pnpm --filter @benchy/web test
      - name: Build and deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:web
