name: Deploy

# Every push to main deploys what it changed, so main is always what runs:
#   api    D1 migrations, then the Worker benchy-api (apps/api, packages/db)
#   web    the site on Cloudflare Pages, getbenchy.lat (apps/web)
#   agent  the Docker image of the per-org agents (apps/agent)
# Tests run first; a failure deploys nothing. The web waits for the Worker
# when both changed, since it calls it.
#
# The per-org agents run on AWS ECS Fargate (cluster benchy): the agent job
# builds the image, pushes it to ECR and forces a new deployment of
# agent-surus, agent-conicet and agent-untref. AWS access is OIDC
# (role benchy-agent-github-deploy), no stored keys.
#
# Secrets: CLOUDFLARE_API_TOKEN, LLM_CLIENT_DEPLOY_KEY.
# Variables: CLOUDFLARE_ACCOUNT_ID. Secrets never reach
# pull requests from forks: this runs only on pushes to main and by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, web, agent]
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.pick.outputs.api }}
      web: ${{ steps.pick.outputs.web }}
      agent: ${{ steps.pick.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            agent:
              - 'apps/agent/**'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          API: ${{ steps.filter.outputs.api }}
          WEB: ${{ steps.filter.outputs.web }}
          AGENT: ${{ steps.filter.outputs.agent }}
        # By hand: what was chosen. On a push: what the push changed.
        run: |
          pick() {
            if [ "$EVENT" = workflow_dispatch ]; then
              { [ "$TARGET" = all ] || [ "$TARGET" = "$1" ]; } && echo true || echo false
            else
              echo "$2"
            fi
          }
          {
            echo "api=$(pick api "$API")"
            echo "web=$(pick web "$WEB")"
            echo "agent=$(pick agent "$AGENT")"
          } | tee -a "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @benchy/api test && pnpm --filter @benchy/api test:scripts
      - name: D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @benchy/api exec wrangler d1 migrations apply benchy-db --remote
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:api

  web:
    needs: [changes, api]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && needs.api.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @benchy/web typecheck && pnpm --filter @benchy/web test
      - name: Build and deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:web

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      ECR_IMAGE: 354918377724.dkr.ecr.us-east-1.amazonaws.com/benchy-agent
    steps:
      - uses: actions/checkout@v4
      - name: Vendor the llm-client wheel
        env:
          LLM_CLIENT_DEPLOY_KEY: ${{ secrets.LLM_CLIENT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LLM_CLIENT_DEPLOY_KEY" > ~/.ssh/llm_client_deploy_key
          chmod 600 ~/.ssh/llm_client_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/llm_client_deploy_key -o StrictHostKeyChecking=accept-new"
          git clone --quiet git@github.com:surus-lat/llm-client.git ~/llm-client
          echo 'apps/agent/vendor/' >> .git/info/exclude
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          LLM_CLIENT_SRC="$HOME/llm-client" sh apps/agent/prepare-vendor.sh
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::354918377724:role/benchy-agent-github-deploy # OIDC role, trust limited to this repo on main
          aws-region: us-east-1
      - name: Build the image
        run: |
          docker build -t benchy-agent apps/agent
      - name: Smoke test the image
        # Compile-check every agent-side Python file and import the two
        # heaviest MCP modules with the image's own interpreter, so a broken
        # module fails the job BEFORE anything is pushed or deployed.
        # /opt/benchy is read-only by design inside the image, so the
        # py_compile bytecode cache is redirected to /tmp. BENCHY_WORKSPACE is
        # resolved at module import time, so it must point at a writable dir.
        run: |
          docker run --rm --entrypoint '' benchy-agent sh -c '
            set -e
            PY=/opt/hermes/.venv/bin/python
            PYTHONPYCACHEPREFIX=/tmp/pycache $PY -m py_compile /opt/benchy/mcp/*.py /opt/benchy/proxy/*.py
            mkdir -p /tmp/smoke-ws
            cd /opt/benchy/mcp
            BENCHY_WORKSPACE=/tmp/smoke-ws $PY -c "import benchy_publication, benchy_sources; print(\"mcp import smoke ok\")"
          '
      - name: Push the image to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin ${ECR_IMAGE%/*}
          ID=$(docker images -q benchy-agent | head -1)
          docker tag benchy-agent "$ECR_IMAGE:latest"
          docker tag benchy-agent "$ECR_IMAGE:img-$ID"
          docker push "$ECR_IMAGE:latest"
          docker push "$ECR_IMAGE:img-$ID"
      - name: Redeploy the three agents
        # Task definitions pin the image by digest (Fase 0), so a plain
        # force-new-deployment would redeploy the OLD digest. Resolve the
        # digest just pushed, register a fresh task-def revision per service
        # pointing at it, and update each service to its new revision.
        run: |
          DIGEST=$(aws ecr describe-images --repository-name benchy-agent --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
          IMAGE="$ECR_IMAGE@$DIGEST"
          echo "deploying $IMAGE"
          for SVC in agent-surus agent-conicet agent-untref; do
            aws ecs describe-task-definition --task-definition "$SVC" --query taskDefinition --no-cli-pager \
              | jq --arg IMG "$IMAGE" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image = $IMG' > /tmp/td-$SVC.json
            REV=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-$SVC.json --query 'taskDefinition.revision' --output text --no-cli-pager)
            aws ecs update-service --cluster benchy --service "$SVC" --task-definition "$SVC:$REV" --no-cli-pager --query 'service.serviceName' --output text
          done
      - name: Assert the three agents come back healthy
        # The services run minimumHealthyPercent=0, maximumPercent=100, so a
        # deploy stops the old task before the new one passes the ALB health
        # check (~5-9 min: task provisioning + gateway cold start). Poll each
        # target group for up to ~10 minutes; fail the job if any agent never
        # comes back instead of leaving prod down unnoticed.
        run: |
          PENDING="benchy-agent-surus benchy-agent-conicet benchy-agent-untref"
          DEADLINE=$((SECONDS + 1320))
          while [ -n "$PENDING" ] && [ "$SECONDS" -lt "$DEADLINE" ]; do
            STILL=""
            for TG in $PENDING; do
              ARN=$(aws elbv2 describe-target-groups --names "$TG" --query 'TargetGroups[0].TargetGroupArn' --output text)
              STATES=$(aws elbv2 describe-target-health --target-group-arn "$ARN" --query 'TargetHealthDescriptions[].TargetHealth.State' --output text | tr '\t' ' ')
              echo "[$TG] ${STATES:-no targets}"
              echo "$STATES" | tr ' ' '\n' | grep -qx healthy || STILL="$STILL $TG"
            done
            PENDING=$(echo "$STILL" | xargs)
            [ -n "$PENDING" ] && sleep 15
          done
          if [ -n "$PENDING" ]; then
            echo "::error title=Deploy gate::no healthy target after ~22 min: $PENDING"
            exit 1
          fi
          echo "all three target groups healthy"
